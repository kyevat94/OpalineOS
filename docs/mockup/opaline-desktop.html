<style>
/* ---- tokens (project.md 6.1) ------------------------------------------------------------ */
:root {
  --bg: #EEE6DA; --surface: #EEE6DA; --inset: #E8DFD2;
  --hl: 255, 251, 245; --sh: 190, 175, 154;
  --hla: .92; --sha: .62;
  --depth: 1; --lx: 1;                 /* light from the top left (-1: top right) */

  --accent: #1E5D59; --accent-strong: #164744; --accent-rgb: 30, 93, 89; --on-accent: #FFFFFF;
  --text: #2D2A26; --text2: #6F665C; --text3: #A79E92;
  --success: #2E7D5B; --warning: #B7832F; --error: #B3423A; --info: #2E6F9E;
  --border: rgba(0, 0, 0, .08);
  --hc: 0 0 0 var(--hcw) rgba(0, 0, 0, .28);
  --e1: calc(var(--lx) * -2px * var(--depth)) calc(-2px * var(--depth)) calc(4px * var(--depth)) rgba(var(--hl), var(--hla)), calc(var(--lx) * 2px * var(--depth)) calc(2px * var(--depth)) calc(4px * var(--depth)) rgba(var(--sh), var(--sha)), var(--hc);
  --e2: calc(var(--lx) * -4px * var(--depth)) calc(-4px * var(--depth)) calc(10px * var(--depth)) rgba(var(--hl), var(--hla)), calc(var(--lx) * 4px * var(--depth)) calc(4px * var(--depth)) calc(10px * var(--depth)) rgba(var(--sh), var(--sha)), var(--hc);
  --e3: calc(var(--lx) * -6px * var(--depth)) calc(-6px * var(--depth)) calc(16px * var(--depth)) rgba(var(--hl), var(--hla)), calc(var(--lx) * 6px * var(--depth)) calc(6px * var(--depth)) calc(16px * var(--depth)) rgba(var(--sh), var(--sha)), var(--hc);
  --e4: calc(var(--lx) * -10px * var(--depth)) calc(-10px * var(--depth)) calc(28px * var(--depth)) rgba(var(--hl), var(--hla)), calc(var(--lx) * 10px * var(--depth)) calc(10px * var(--depth)) calc(28px * var(--depth)) rgba(var(--sh), calc(var(--sha) + .08)), var(--hc);
  --e5: calc(var(--lx) * -14px * var(--depth)) calc(-14px * var(--depth)) calc(36px * var(--depth)) rgba(var(--hl), var(--hla)), calc(var(--lx) * 14px * var(--depth)) calc(14px * var(--depth)) calc(36px * var(--depth)) rgba(var(--sh), calc(var(--sha) + .12)), var(--hc);
  --in1: inset calc(var(--lx) * 3px * var(--depth)) calc(3px * var(--depth)) calc(6px * var(--depth)) rgba(var(--sh), var(--sha)), inset calc(var(--lx) * -3px * var(--depth)) calc(-3px * var(--depth)) calc(6px * var(--depth)) rgba(var(--hl), var(--hla)), var(--hc);
  --in2: inset calc(var(--lx) * 4px * var(--depth)) calc(4px * var(--depth)) calc(8px * var(--depth)) rgba(var(--sh), calc(var(--sha) + .1)), inset calc(var(--lx) * -4px * var(--depth)) calc(-4px * var(--depth)) calc(8px * var(--depth)) rgba(var(--hl), var(--hla)), var(--hc);
  --in-acc: inset calc(var(--lx) * 3px * var(--depth)) calc(3px * var(--depth)) calc(6px * var(--depth)) rgba(0, 0, 0, .42), inset calc(var(--lx) * -2px * var(--depth)) calc(-2px * var(--depth)) calc(4px * var(--depth)) rgba(255, 255, 255, .07), var(--hc);
  --knob-on-acc: calc(var(--lx) * 2px) 2px 5px rgba(0, 0, 0, .38);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  --fast: 120ms;
  --bar-h: 38px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 90% at 30% 20%, rgba(255, 251, 245, .55), transparent 60%),
                    radial-gradient(90% 80% at 90% 100%, rgba(201, 162, 107, .10), transparent 60%);
  color: var(--text); font: 14px/1.4 Inter, system-ui, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none;
}
body.reduce * { transition-duration: 1ms !important; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s16 { width: 16px; height: 16px; }
svg.i.s24 { width: 24px; height: 24px; }

/* ---- relief primitives -------------------------------------------------------------------- */
.e1 { box-shadow: var(--e1); } .e2 { box-shadow: var(--e2); } .e3 { box-shadow: var(--e3); }
.e4 { box-shadow: var(--e4); } .e5 { box-shadow: var(--e5); }
.in1 { box-shadow: var(--in1); background: var(--inset); } .in2 { box-shadow: var(--in2); }
.press { transition: box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease), background var(--fast), color var(--fast); }
.btn {
  height: 38px; padding: 0 18px; border-radius: 12px; background: var(--surface); box-shadow: var(--e3);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--text);
  transition: box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease), background var(--fast), color var(--fast);
}
.btn:hover { box-shadow: var(--e2); }
.btn:active, .btn.down { box-shadow: var(--in2); transform: scale(.99); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.primary:active { box-shadow: var(--in-acc); background: var(--accent-strong); }
.btn.ghost { box-shadow: none; } .btn.ghost:hover { box-shadow: var(--e1); }
.btn.danger { color: var(--error); }
.btn.danger.primary { background: var(--error); color: #fff; }
.btn:disabled { box-shadow: var(--in1); color: var(--text3); cursor: not-allowed; background: var(--inset); }
.btn.small { height: 30px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
.icon-btn { width: 34px; height: 34px; border-radius: 11px; display: inline-grid; place-items: center; background: var(--surface); box-shadow: var(--e2); color: var(--text2); transition: box-shadow var(--fast) var(--ease), color var(--fast), transform var(--fast) var(--ease); }
.icon-btn:hover { color: var(--accent); }
.icon-btn:active, .icon-btn.on { box-shadow: var(--in2); color: var(--accent); }
.focus-ring:focus-visible, .btn:focus-visible, .icon-btn:focus-visible { outline: none; box-shadow: var(--e2), 0 0 0 3px rgba(46, 140, 134, .45); }
.field {
  height: 40px; padding: 0 14px; border-radius: 12px; border: 0; outline: none; width: 100%;
  background: var(--inset); box-shadow: var(--in1); color: var(--text);
  transition: box-shadow 160ms var(--ease);
}
.field::placeholder { color: var(--text3); }
.field:focus { box-shadow: var(--in1), 0 0 0 2px rgba(46, 140, 134, .55), 0 0 14px rgba(46, 140, 134, .25); }
.field.error { box-shadow: var(--in1), 0 0 0 2px rgba(179, 66, 58, .55); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text2); }
.caption { font-size: 12px; color: var(--text2); }
.caption.err { color: var(--error); }
h1, h2, h3 { margin: 0; font-weight: 600; }
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.scroll { overflow: auto; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(var(--sh), .6); border-radius: 10px; border: 3px solid var(--bg); }

/* switch, checkbox, radio, slider */
.switch { width: 50px; height: 28px; border-radius: 99px; background: var(--inset); box-shadow: var(--in1); position: relative; cursor: pointer; transition: background 200ms var(--ease); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--e1); transition: transform 280ms var(--bounce), background 200ms; }
.switch.on { background: var(--accent); box-shadow: var(--in-acc); }
.switch.on::after { transform: translateX(22px); background: #F7F2EA; box-shadow: var(--knob-on-acc); }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.check .box { width: 22px; height: 22px; border-radius: 7px; background: var(--surface); box-shadow: var(--e1); display: grid; place-items: center; transition: all 160ms var(--ease); color: transparent; }
.check.on .box { background: var(--accent); box-shadow: var(--in-acc); color: #fff; }
.check .box svg { transform: scale(.4); transition: transform 260ms var(--bounce); }
.check.on .box svg { transform: scale(1); }
.radio .box { border-radius: 50%; }
.radio.on .box { background: var(--surface); box-shadow: var(--in1); }
.radio .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform 260ms var(--bounce); }
.radio.on .dot { transform: scale(1); }
.slider { position: relative; height: 34px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.slider .track { position: absolute; left: 0; right: 0; height: 10px; border-radius: 99px; background: var(--inset); box-shadow: var(--in1); }
.slider .fill { position: absolute; left: 0; height: 10px; border-radius: 99px; background: var(--accent); box-shadow: var(--in-acc); }
.slider .knob { position: absolute; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--surface); box-shadow: var(--e2); transition: transform 160ms var(--bounce); }
.slider:active .knob { transform: scale(1.12); box-shadow: var(--e3); }
.slider .tip { position: absolute; top: -24px; margin-left: -20px; width: 40px; text-align: center; font-size: 11px; font-weight: 600; background: var(--text); color: var(--bg); border-radius: 6px; padding: 2px 0; opacity: 0; transform: translateY(4px); transition: all 160ms var(--ease); pointer-events: none; }
.slider:hover .tip, .slider:active .tip { opacity: 1; transform: none; }

/* ---- the top bar ------------------------------------------------------------------------------- */
#bar {
  position: fixed; top: 6px; left: 8px; right: 8px; height: var(--bar-h); z-index: 9000;
  border-radius: 14px; background: var(--surface); box-shadow: var(--e3);
  display: flex; align-items: center; gap: 6px; padding: 0 6px;
}
#start { height: 28px; padding: 0 12px 0 8px; border-radius: 10px; display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: var(--e1); transition: box-shadow var(--fast) var(--ease), color var(--fast); color: var(--text); }
#start:hover { color: var(--accent); }
#start.on, #start:active { box-shadow: var(--in2); color: var(--accent); }
#start .logo { width: 20px; height: 20px; }
#tasks { flex: 1; display: flex; gap: 6px; align-items: center; overflow: hidden; padding: 4px 6px; }
.task {
  height: 28px; padding: 0 12px 0 8px; border-radius: 10px; display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500; color: var(--text2); box-shadow: var(--e1); white-space: nowrap; flex: none;
  transition: box-shadow 160ms var(--ease), color 160ms, opacity 160ms; position: relative;
}
.task:hover { box-shadow: var(--e2); color: var(--text); }
.task.active { box-shadow: var(--in2); color: var(--accent); }
.task.min { opacity: .62; }
.task::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 14px; height: 3px; margin-left: -7px; border-radius: 3px; background: var(--accent); transform: scaleX(0); transition: transform 220ms var(--bounce); }
.task.active::after { transform: scaleX(1); }
.task svg.i { width: 16px; height: 16px; }
#tray { display: flex; align-items: center; gap: 4px; padding-right: 2px; }
.tray-btn { height: 28px; min-width: 28px; padding: 0 7px; border-radius: 9px; display: flex; align-items: center; gap: 6px; color: var(--text2); transition: box-shadow var(--fast) var(--ease), color var(--fast); font-size: 13px; font-weight: 500; }
.tray-btn:hover { box-shadow: var(--e1); color: var(--text); }
.tray-btn.on, .tray-btn:active { box-shadow: var(--in2); color: var(--accent); }
.tray-btn .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--error); margin-left: -4px; margin-top: -10px; transform: scale(0); transition: transform 260ms var(--bounce); }
.tray-btn .badge-dot.show { transform: scale(1); }
#clock { font-variant-numeric: tabular-nums; }

/* ---- popovers (elevation 5) ------------------------------------------------------------------------ */
.pop { position: fixed; z-index: 9500; background: var(--surface); border-radius: 20px; box-shadow: var(--e5); display: none; transform-origin: top left; }
.pop.right { transform-origin: top right; }
#launcher { top: 54px; left: 8px; width: 460px; padding: 18px; }
.app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 16px 0; }
.app-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 4px; border-radius: 16px; transition: box-shadow 160ms var(--ease), transform 160ms var(--ease); }
.app-tile:hover { box-shadow: var(--e2); }
.app-tile:active { box-shadow: var(--in2); transform: scale(.98); }
.app-tile .ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--e3); color: var(--accent); }
.app-tile .ico svg.i { width: 26px; height: 26px; }
.app-tile span { font-size: 12px; font-weight: 500; text-align: center; color: var(--text); }
.app-tile.hidden { display: none; }
.power-row { display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 14px; }
#center { top: 54px; right: 8px; width: 360px; padding: 16px; }
.qs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qs { height: 56px; border-radius: 16px; padding: 0 12px; display: flex; align-items: center; gap: 10px; box-shadow: var(--e2); text-align: left; transition: box-shadow 160ms var(--ease), color 160ms; }
.qs .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; box-shadow: var(--e1); color: var(--text2); transition: all 160ms var(--ease); }
.qs.on { box-shadow: var(--in1); }
.qs.on .ic { background: var(--accent); color: #fff; box-shadow: var(--in-acc); }
.qs b { display: block; font-size: 13px; font-weight: 600; }
.qs small { font-size: 11px; color: var(--text2); }
.notif { display: flex; gap: 10px; padding: 12px; border-radius: 14px; box-shadow: var(--e1); margin-top: 10px; align-items: flex-start; }
.notif .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--e1); color: var(--accent); flex: none; }
.notif p { margin: 2px 0 0; font-size: 12px; color: var(--text2); }

/* ---- windows (elevation 4) ------------------------------------------------------------------------------- */
#desk { position: fixed; inset: 0; }
.win {
  position: absolute; display: flex; flex-direction: column; border-radius: 18px; background: var(--surface);
  box-shadow: var(--e4); min-width: 320px; min-height: 200px; transition: box-shadow 220ms var(--ease), filter 220ms var(--ease);
  will-change: transform;
}
.win.inactive { box-shadow: var(--e3); filter: saturate(.8); }
.win.inactive .titlebar .ttl { color: var(--text3); }
.win.max { border-radius: 14px; }
.win.dragging { box-shadow: var(--e5); }
.titlebar { height: 44px; flex: none; display: flex; align-items: center; padding: 0 10px 0 16px; cursor: default; }
.titlebar .ttl { flex: 1; display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; color: var(--text); transition: color 220ms; }
.titlebar .ttl svg { color: var(--accent); }
.wbtns { display: flex; gap: 8px; }
.wb { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: var(--e1); color: var(--text3); transition: box-shadow var(--fast) var(--ease), color var(--fast), background var(--fast); }
.wbtns:hover .wb { color: var(--text2); }
.wb:hover { box-shadow: var(--e2); }
.wb:active { box-shadow: var(--in2); }
.wb.close:hover { background: var(--error); color: #fff; }
.wb svg.i { width: 12px; height: 12px; stroke-width: 2.6; }
.wbody { flex: 1; min-height: 0; padding: 0 16px 16px; display: flex; flex-direction: column; }
.resize { position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; cursor: nwse-resize; border-radius: 0 0 16px 0; }
.win.max .resize { display: none; }

/* ---- shared bits inside apps --------------------------------------------------------------------------------- */
.panel { border-radius: 16px; background: var(--inset); box-shadow: var(--in1); }
.card { border-radius: 16px; background: var(--surface); box-shadow: var(--e3); padding: 16px; transition: box-shadow 200ms var(--ease), transform 200ms var(--ease); }
.card.hoverable:hover { box-shadow: var(--e4); transform: translateY(-2px); }
.card.hoverable:active { box-shadow: var(--in1); transform: scale(.99); }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--accent); color: #fff; }
.badge.soft { background: var(--surface); color: var(--accent); box-shadow: var(--e1); }
.badge.err { background: var(--error); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--accent); background: var(--surface); box-shadow: var(--e2); }
.avatar.ringed { box-shadow: var(--e2), 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--inset); box-shadow: var(--in1); position: relative; }
.tab { position: relative; z-index: 1; height: 32px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--text2); transition: color 200ms; }
.tab.on { color: var(--accent); }
.tabs .ind { position: absolute; top: 4px; height: 32px; border-radius: 10px; background: var(--surface); box-shadow: var(--e1); transition: left 320ms var(--bounce), width 320ms var(--bounce); }
.steps { display: flex; align-items: flex-start; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; position: relative; font-size: 12px; color: var(--text2); }
.step .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); box-shadow: var(--e2); transition: all 260ms var(--ease); position: relative; z-index: 1; }
.step.done .n { box-shadow: var(--in1); color: var(--accent); }
.step.cur .n { background: var(--accent); color: #fff; transform: scale(1.12); }
.step.cur { color: var(--text); font-weight: 600; }
.step + .step::before { content: ""; position: absolute; top: 16px; right: 50%; width: 100%; height: 3px; border-radius: 3px; background: var(--inset); box-shadow: var(--in1); }
.step.done::before, .step.cur::before { background: var(--accent) !important; box-shadow: none !important; }
.progress { height: 10px; border-radius: 99px; background: var(--inset); box-shadow: var(--in1); overflow: hidden; }
.progress > div { height: 100%; width: 0; border-radius: 99px; background: var(--accent); box-shadow: var(--in-acc); transition: width 600ms var(--ease); }
.progress.indet > div { width: 35%; animation: indet 1.3s var(--ease) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.spinner { width: 30px; height: 30px; position: relative; }
.spinner i { position: absolute; left: 13px; top: 1px; width: 4px; height: 8px; border-radius: 2px; background: var(--accent); transform-origin: 2px 14px; animation: spin 1s linear infinite; opacity: .15; }
@keyframes spin { 0% { opacity: 1; } 100% { opacity: .15; } }
.skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--inset), #F6F0E7, var(--inset)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; box-shadow: var(--in1); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.pager { display: flex; gap: 6px; align-items: center; }
.pg { width: 32px; height: 32px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--text2); transition: box-shadow var(--fast) var(--ease), color var(--fast), background var(--fast); }
.pg:hover { box-shadow: var(--e1); }
.pg.on { background: var(--accent); color: #fff; box-shadow: var(--in-acc); }
.crumbs { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 12px; box-shadow: var(--e1); font-size: 13px; color: var(--text2); }
.crumbs button { padding: 2px 6px; border-radius: 7px; color: var(--text2); }
.crumbs button:hover { color: var(--accent); }
.crumbs button.cur { color: var(--text); font-weight: 600; }
.tooltip-host { position: relative; display: inline-block; }
.tooltip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 6px) scale(.96); background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: all 180ms var(--ease); }
.tooltip-host:hover .tooltip { opacity: 1; transform: translate(-50%, 0) scale(1); }
.section-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); margin: 8px 0 12px; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ""; flex: 1; height: 2px; border-radius: 2px; box-shadow: var(--in1); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--text2); padding: 8px 10px; cursor: pointer; }
th:hover { color: var(--accent); }
td { padding: 8px 10px; border-top: 1px solid var(--border); }
tr.sel td { color: var(--accent); }

/* ---- toasts, dialogs, boot ----------------------------------------------------------------------------------------- */
#toasts { position: fixed; top: 56px; right: 14px; z-index: 9800; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; min-width: 260px; max-width: 340px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--e5); font-size: 13px; }
.toast .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.toast b { font-weight: 600; }
#scrim { position: fixed; inset: 0; background: rgba(238, 230, 218, .62); z-index: 9900; display: none; }
.dialog { position: fixed; z-index: 9950; left: 50%; top: 50%; width: 340px; margin: -150px 0 0 -170px; padding: 24px; border-radius: 22px; background: var(--surface); box-shadow: var(--e5); text-align: center; display: none; }
.dialog .big { width: 64px; height: 64px; margin: 4px auto 14px; border-radius: 20px; display: grid; place-items: center; box-shadow: var(--in1); color: var(--warning); }
.dialog p { color: var(--text2); margin: 8px 0 20px; }
.dialog .row { justify-content: center; }
#boot { position: fixed; inset: 0; z-index: 10000; background: var(--bg); display: grid; place-items: center; cursor: pointer; }
#boot .box { display: flex; flex-direction: column; align-items: center; gap: 22px; }
#boot .logo-wrap { width: 112px; height: 112px; border-radius: 34px; display: grid; place-items: center; box-shadow: var(--e4); color: var(--accent); }
#boot .logo-wrap svg { width: 62px; height: 62px; }
#boot h1 { font-size: 22px; letter-spacing: .02em; }
#boot .progress { width: 220px; }
#boot .hint { font-size: 12px; color: var(--text3); }
#dim { position: fixed; inset: 0; pointer-events: none; z-index: 9990; background: #000; opacity: 0; transition: opacity 200ms; }
#night { position: fixed; inset: 0; pointer-events: none; z-index: 9991; background: #FF9A3C; mix-blend-mode: multiply; opacity: 0; transition: opacity 600ms var(--ease); }

/* ---- apps --------------------------------------------------------------------------------------------------------- */
.files { display: flex; gap: 14px; flex: 1; min-height: 0; }
.files .side { width: 170px; flex: none; display: flex; flex-direction: column; gap: 6px; padding: 10px; }
.side-item { height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 10px; color: var(--text2); font-weight: 500; font-size: 13px; transition: box-shadow 160ms var(--ease), color 160ms; }
.side-item:hover { color: var(--text); box-shadow: var(--e1); }
.side-item.on { color: var(--accent); box-shadow: var(--e2); background: var(--surface); }
.files .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; padding: 14px; align-content: start; }
.fitem { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px; border-radius: 14px; transition: box-shadow 160ms var(--ease), transform 160ms var(--ease); text-align: center; font-size: 12.5px; }
.fitem:hover { box-shadow: var(--e2); }
.fitem.sel { box-shadow: var(--in1); color: var(--accent); }
.fitem .fi { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--e2); color: var(--accent); }
.fitem .fi.doc { color: var(--text2); }
.fitem .fi svg.i { width: 24px; height: 24px; }
.flist .fitem { flex-direction: row; justify-content: flex-start; padding: 6px 10px; text-align: left; }
.flist .fitem .fi { width: 34px; height: 34px; border-radius: 10px; }
.flist { grid-template-columns: 1fr; gap: 4px; }
.term { flex: 1; min-height: 0; padding: 14px 16px; font: 13px/1.55 "JetBrains Mono", Consolas, monospace; color: var(--accent-strong); overflow: auto; user-select: text; cursor: text; }
.term .line { white-space: pre-wrap; word-break: break-word; }
.term .prompt { color: var(--accent); font-weight: 500; }
.term .dim { color: var(--text2); }
.term input { background: none; border: 0; outline: none; font: inherit; color: var(--text); width: 60%; caret-color: var(--accent); }
.mon-grid { display: grid; grid-template-columns: 180px 1fr; gap: 14px; }
.ring { position: relative; width: 150px; height: 150px; margin: 6px auto; border-radius: 50%; box-shadow: var(--e3); display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .val { font-size: 28px; font-weight: 700; }
.ring .inner { width: 104px; height: 104px; border-radius: 50%; box-shadow: var(--in1); background: var(--inset); display: grid; place-items: center; text-align: center; }
.set { display: flex; gap: 14px; flex: 1; min-height: 0; }
.set .pane { flex: 1; overflow: auto; padding: 2px 6px 2px 2px; }
.set-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; box-shadow: var(--e1); margin-bottom: 12px; }
.set-row .t { flex: 1; }
.set-row .t b { display: block; font-weight: 600; }
.set-row .t small { color: var(--text2); font-size: 12px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; box-shadow: var(--e1); transition: transform 200ms var(--bounce), box-shadow 160ms; }
.swatch.on { transform: scale(1.18); box-shadow: var(--e1), 0 0 0 3px var(--bg), 0 0 0 5px currentColor; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--inset); box-shadow: var(--in1); }
.seg button { height: 28px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--text2); transition: all 180ms var(--ease); }
.seg button.on { background: var(--surface); box-shadow: var(--e1); color: var(--accent); }
.editor { flex: 1; min-height: 0; resize: none; border: 0; outline: none; padding: 16px; border-radius: 16px; background: var(--inset); box-shadow: var(--in1); font: 14px/1.6 Inter, sans-serif; color: var(--text); user-select: text; }
.status { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); padding: 10px 4px 0; }
.kit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.kit .card { display: flex; flex-direction: column; gap: 14px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; border-radius: 16px; border: 2px dashed rgba(var(--sh), .7); text-align: center; color: var(--text2); }
.empty .big { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; box-shadow: var(--e2); color: var(--text3); }
</style>
</head>

/* ===================================================================================================
   Helpers
   =================================================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const icon = (name, cls = "") => `<svg class="i ${cls}"><use href="#i-${name}"/></svg>`;
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
const prefs = { effects: "smooth", reduce: matchMedia("(prefers-reduced-motion: reduce)").matches };
const mode = () => prefs.reduce ? "fade" : prefs.effects;

/* A damped spring sampled into keyframe progress values (what rl.curves.spring describes). */
function springSteps(stiffness = 380, damping = 26) {
  let x = 0, v = 0; const out = [0]; const dt = 1 / 120;
  for (let i = 0; i < 240; i++) {
    const a = stiffness * (1 - x) - damping * v; v += a * dt; x += v * dt;
    if (i % 2) out.push(x);
    if (i > 40 && Math.abs(1 - x) < 0.001 && Math.abs(v) < 0.01) break;
  }
  out.push(1); return out;
}
const SPRING = springSteps();
const springMs = () => Math.round(SPRING.length * 1000 / 60);
function springFrames(fn) { return SPRING.map((p, i) => ({ ...fn(p), offset: i / (SPRING.length - 1) })); }

/* Slider component */
function makeSlider(host, { value = .5, min = 0, max = 1, step = 0, fmt = v => Math.round(v * 100) + "%", onChange }) {
  host.classList.add("slider");
  host.innerHTML = `<div class="track"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div>`;
  const fill = $(".fill", host), knob = $(".knob", host), tip = $(".tip", host);
  const set = (v, fire) => {
    v = Math.min(max, Math.max(min, v)); if (step) v = Math.round(v / step) * step;
    const pct = (v - min) / (max - min) * 100;
    fill.style.width = pct + "%"; knob.style.left = pct + "%"; tip.style.left = pct + "%"; tip.textContent = fmt(v);
    host.value = v; if (fire && onChange) onChange(v);
  };
  const fromEvent = e => { const r = host.getBoundingClientRect(); set(min + (e.clientX - r.left) / r.width * (max - min), true); };
  host.addEventListener("pointerdown", e => { host.setPointerCapture(e.pointerId); fromEvent(e); host.onpointermove = fromEvent; });
  host.addEventListener("pointerup", () => host.onpointermove = null);
  set(value, false); host.set = set; return host;
}
function makeSwitch(on, onChange) {
  const s = h(`<div class="switch ${on ? "on" : ""}" role="switch" tabindex="0"></div>`);
  s.addEventListener("click", () => { s.classList.toggle("on"); onChange?.(s.classList.contains("on")); });
  return s;
}

let openPop = null;
function showPop(pop, btn) {
  if (openPop === pop) return hidePop();
  hidePop(true);
  openPop = pop; pop._btn = btn; btn?.classList.add("on");
  pop.style.display = "block";
  pop.animate(mode() === "none" ? [{}] : mode() === "fade" ? [{ opacity: 0 }, { opacity: 1 }] :
    springFrames(p => ({ opacity: Math.min(1, p * 1.6), transform: `translateY(${(1 - p) * -8}px) scale(${.96 + .04 * p})` })),
    { duration: mode() === "smooth" ? springMs() : 120, easing: "linear" });
  if (pop.id === "launcher") setTimeout(() => $("#search").focus(), 30);
}
function hidePop(instant) {
  const pop = openPop; if (!pop) return;
  openPop = null; pop._btn?.classList.remove("on");
  if (instant || mode() === "none") { pop.style.display = "none"; return; }
  pop.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-6px) scale(.97)" }],
    { duration: 140, easing: "cubic-bezier(.4,0,1,1)" }).onfinish = () => { if (openPop !== pop) pop.style.display = "none"; };
}
document.addEventListener("pointerdown", e => {
  if (openPop && !openPop.contains(e.target) && !openPop._btn?.contains(e.target)) hidePop();
});

const KINDS = { success: ["var(--success)", "check"], info: ["var(--info)", "info"], error: ["var(--error)", "alert"], warning: ["var(--warning)", "alert"] };
function toast(text, kind = "info", title = "") {
  const [color, ic] = KINDS[kind];
  const el = h(`<div class="toast"><div class="ic" style="background:${color}">${icon(ic, "s16")}</div><div class="grow">${title ? `<b>${title}</b> ` : ""}${text}</div></div>`);
  $("#toasts").prepend(el);
  el.animate(mode() === "smooth" ? springFrames(p => ({ opacity: Math.min(1, p * 2), transform: `translateX(${(1 - p) * 60}px)` }))
    : [{ opacity: 0 }, { opacity: 1 }], { duration: mode() === "smooth" ? springMs() : 120 });
  const leave = () => {
    if (el._gone) return; el._gone = true;
    const a = el.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(60px)" }], { duration: 200, easing: "cubic-bezier(.4,0,1,1)" });
    a.onfinish = () => {
      const hgt = el.offsetHeight + 10;
      el.style.visibility = "hidden";
      el.animate([{ marginTop: 0 }, { marginTop: -hgt + "px" }], { duration: 180, easing: "ease" }).onfinish = () => el.remove();
    };
  };
  el.addEventListener("click", leave); setTimeout(leave, 3800);
  addNotif(text, ic, kind);
}

let dialogResolve = null;
function dialog(title, text, okText, danger = false) {
  $("#dlg-title").textContent = title; $("#dlg-text").textContent = text;
  const ok = $("#dlg-ok"); ok.textContent = okText; ok.className = "btn primary" + (danger ? " danger" : "");
  const scrim = $("#scrim"), dlg = $("#dialog");
  scrim.style.display = "block"; dlg.style.display = "block";
  scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
  dlg.animate(mode() === "smooth" ? springFrames(p => ({ opacity: Math.min(1, p * 1.8), transform: `scale(${.9 + .1 * p})` }))
    : [{ opacity: 0 }, { opacity: 1 }], { duration: mode() === "smooth" ? springMs() : 120 });
  return new Promise(res => dialogResolve = res);
}
function closeDialog(result) {
  const scrim = $("#scrim"), dlg = $("#dialog");
  scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).onfinish = () => scrim.style.display = "none";
  dlg.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.94)" }], { duration: 150, easing: "cubic-bezier(.4,0,1,1)" })
    .onfinish = () => dlg.style.display = "none";
  dialogResolve?.(result); dialogResolve = null;
}
$("#dlg-ok").onclick = () => closeDialog(true);
$("#dlg-cancel").onclick = () => closeDialog(false);
$("#scrim").onclick = () => closeDialog(false);

/* ===================================================================================================
   Window manager (what the compositor does with opaline-relief's effect descriptions)
   =================================================================================================== */
const desk = $("#desk"), tasks = $("#tasks");
const wins = new Map();   // app id -> window record
let zTop = 10, cascade = 0;
const workArea = () => ({ x: 10, y: 54, w: Math.max(340, innerWidth - 20), h: Math.max(240, innerHeight - 64) });
addEventListener("resize", () => {   /* the screen changed size: maximized windows follow it */
  for (const w of wins.values()) if (w.max) setRect(w.el, workArea());
});

function rectOf(el) { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
function setRect(el, r) { Object.assign(el.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" }); }
function flipFrom(el, from, duration, easing) {   /* animate from an old rect to the current one */
  const to = rectOf(el);
  const sx = from.w / to.w, sy = from.h / to.h;
  return el.animate([{ transformOrigin: "0 0", transform: `translate(${from.x - to.x}px, ${from.y - to.y}px) scale(${sx}, ${sy})` },
                     { transformOrigin: "0 0", transform: "none" }], { duration, easing });
}

function focusWin(w) {
  if (!w || w.min) return;
  for (const o of wins.values()) { o.el.classList.toggle("inactive", o !== w); o.pill.classList.toggle("active", o === w && !o.min); }
  w.el.style.zIndex = ++zTop;
}
function topVisible() { let best = null; for (const w of wins.values()) if (!w.min && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w; return best; }

function openApp(id) {
  hidePop();
  const app = APPS[id];
  const existing = wins.get(id);
  if (existing) { existing.min ? restore(existing) : (focusWin(existing), nudge(existing)); return; }
  const el = h(`<div class="win"><div class="titlebar"><div class="ttl">${icon(app.icon, "s16")}<span data-i18n="${id}">${t(id)}</span></div>
    <div class="wbtns"><button class="wb min" title="Minimize">${icon("min")}</button><button class="wb max" title="Maximize">${icon("max")}</button><button class="wb close" title="Close">${icon("close")}</button></div></div>
    <div class="wbody"></div><div class="resize"></div></div>`);
  const wa = workArea();
  const w = Math.max(320, Math.min(app.w, wa.w - 40)), hh = Math.max(220, Math.min(app.h, wa.h - 30));
  const r = { x: Math.round(wa.x + (wa.w - w) / 2 + (cascade % 5) * 28 - 56), y: Math.round(wa.y + Math.max(0, (wa.h - hh) / 2 - 20) + (cascade % 5) * 24 - 30), w, h: hh };
  r.y = Math.max(wa.y, r.y); r.x = Math.max(wa.x, r.x); cascade++;
  setRect(el, r);
  desk.append(el);
  const pill = h(`<button class="task">${icon(app.icon)}<span data-i18n="${id}">${t(id)}</span></button>`);
  tasks.append(pill);
  pill.animate(mode() === "smooth" ? springFrames(p => ({ opacity: Math.min(1, p * 2), transform: `scale(${.6 + .4 * p})` })) : [{ opacity: 0 }, { opacity: 1 }],
    { duration: mode() === "smooth" ? springMs() : 120 });
  const rec = { id, el, pill, min: false, max: false, restoreRect: null };
  wins.set(id, rec);
  app.build($(".wbody", el), rec);
  wireWindow(rec);
  focusWin(rec);
  const m = mode();
  if (m === "smooth") el.animate(springFrames(p => ({ opacity: Math.min(1, p * 1.7), transform: `translateY(${(1 - p) * 22}px) scale(${.92 + .08 * p})` })), { duration: springMs() });
  else if (m !== "none") el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: m === "fast" ? 110 : 120 });
}

function nudge(w) {   /* already open: a small bounce says "here it is" */
  if (mode() === "none") return;
  w.el.animate(springFrames(p => ({ transform: `scale(${1 + .03 * Math.sin(p * Math.PI)})` })), { duration: 300 });
}

function closeWin(w) {
  const m = mode();
  const finish = () => { w.el.remove(); wins.delete(w.id); APPS[w.id].onClose?.(w); focusWin(topVisible()); };
  w.pill.animate([{ opacity: 1, transform: "none", maxWidth: w.pill.offsetWidth + "px" }, { opacity: 0, transform: "scale(.6)", maxWidth: "0px", paddingLeft: 0, paddingRight: 0 }],
    { duration: m === "none" ? 1 : 220, easing: "ease" }).onfinish = () => w.pill.remove();
  if (m === "none") return finish();
  w.el.style.pointerEvents = "none";
  w.el.animate(m === "smooth" ? [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.94)" }] : [{ opacity: 1 }, { opacity: 0 }],
    { duration: m === "smooth" ? 170 : 100, easing: "cubic-bezier(.4,0,1,1)" }).onfinish = finish;
}

function minimize(w) {
  if (w.min) return;
  w.min = true; w.pill.classList.add("min"); w.pill.classList.remove("active");
  const m = mode();
  const done = () => { w.el.style.display = "none"; focusWin(topVisible()); };
  if (m === "none") return done();
  if (m !== "smooth") { w.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120 }).onfinish = done; return; }
  const from = rectOf(w.el), to = rectOf(w.pill);
  w.el.animate([{ transformOrigin: "0 0", transform: "none", opacity: 1 },
                { transformOrigin: "0 0", transform: `translate(${to.x - from.x}px, ${to.y - from.y}px) scale(${to.w / from.w}, ${to.h / from.h})`, opacity: .15 }],
    { duration: 340, easing: "cubic-bezier(.5,0,.3,1)" }).onfinish = done;
  w.pill.animate([{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 260, delay: 260 });
}

function restore(w) {
  if (!w.min) return;
  w.min = false; w.pill.classList.remove("min");
  w.el.style.display = "flex";
  focusWin(w);
  const m = mode();
  if (m === "none") return;
  if (m !== "smooth") { w.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120 }); return; }
  const to = rectOf(w.el), from = rectOf(w.pill);
  w.el.animate(springFrames(p => ({ transformOrigin: "0 0", opacity: Math.min(1, .15 + p),
    transform: `translate(${(from.x - to.x) * (1 - p)}px, ${(from.y - to.y) * (1 - p)}px) scale(${from.w / to.w + (1 - from.w / to.w) * p}, ${from.h / to.h + (1 - from.h / to.h) * p})` })),
    { duration: springMs() });
}

function toggleMax(w) {
  const from = rectOf(w.el);
  if (w.max) { setRect(w.el, w.restoreRect); w.max = false; w.el.classList.remove("max"); }
  else { w.restoreRect = from; const wa = workArea(); setRect(w.el, { x: wa.x, y: wa.y, w: wa.w, h: wa.h }); w.max = true; w.el.classList.add("max"); }
  const m = mode();
  if (m === "none") return;
  if (m === "smooth") flipFrom(w.el, from, 280, "cubic-bezier(.2,.8,.2,1)");
  else w.el.animate([{ opacity: .6 }, { opacity: 1 }], { duration: 120 });
  APPS[w.id].onResize?.(w);
}

function wireWindow(w) {
  const el = w.el, bar = $(".titlebar", el);
  el.addEventListener("pointerdown", () => focusWin(w), true);
  $(".wb.close", el).onclick = () => closeWin(w);
  $(".wb.min", el).onclick = () => minimize(w);
  $(".wb.max", el).onclick = () => toggleMax(w);
  bar.addEventListener("dblclick", e => { if (!e.target.closest(".wb")) toggleMax(w); });
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest(".wb") || e.button !== 0) return;
    const start = { x: e.clientX, y: e.clientY }, r0 = rectOf(el);
    let moved = false;
    bar.setPointerCapture(e.pointerId);
    bar.onpointermove = ev => {
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      if (!moved) {
        moved = true; el.classList.add("dragging");
        if (w.max) {   /* dragging a maximized window: it comes back to its size under the pointer */
          w.max = false; el.classList.remove("max");
          const rr = w.restoreRect; r0.x = start.x - rr.w * ((start.x - r0.x) / r0.w); r0.w = rr.w; r0.h = rr.h; setRect(el, r0);
        }
        if (mode() !== "none") el.animate([{ transform: "scale(1)" }, { transform: "scale(1.012)" }], { duration: 120, fill: "forwards" });
      }
      const wa = workArea();
      el.style.left = Math.min(innerWidth - 80, Math.max(-r0.w + 80, r0.x + dx)) + "px";
      el.style.top = Math.min(innerHeight - 50, Math.max(wa.y - 4, r0.y + dy)) + "px";
    };
    bar.onpointerup = () => {
      bar.onpointermove = bar.onpointerup = null;
      if (!moved) return;
      el.classList.remove("dragging");
      el.getAnimations().forEach(a => a.cancel());
      if (mode() !== "none") el.animate([{ transform: "scale(1.012)" }, { transform: "scale(1)" }], { duration: 160 });
    };
  });
  const rz = $(".resize", el);
  rz.addEventListener("pointerdown", e => {
    e.stopPropagation(); rz.setPointerCapture(e.pointerId);
    const s = { x: e.clientX, y: e.clientY }, r0 = rectOf(el);
    rz.onpointermove = ev => { el.style.width = Math.max(320, r0.w + ev.clientX - s.x) + "px"; el.style.height = Math.max(200, r0.h + ev.clientY - s.y) + "px"; APPS[w.id].onResize?.(w); };
    rz.onpointerup = () => rz.onpointermove = rz.onpointerup = null;
  });
  w.pill.onclick = () => {
    if (w.min) restore(w);
    else if (w.pill.classList.contains("active")) minimize(w);
    else focusWin(w);
  };
}

    if (animate && mode() === "smooth") [...grid.children].forEach((c, i) => c.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
      { duration: 260, delay: i * 35, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }));
  };
  side.onclick = e => { const b = e.target.closest("[data-k]"); if (b) go(b.dataset.k); };

  $(".vl", body).onclick = () => { list = true; $(".vl", body).classList.add("on"); $(".vg", body).classList.remove("on"); render(true); };

/* ---- Terminal ---- */
APPS.terminal = { icon: "terminal", w: 640, h: 400, build(body, w) {
  body.innerHTML = `<div class="term panel scroll"></div>`;
  const term = $(".term", body);
  let cwd = "/home";
  const out = s => { const d = h(`<div class="line"></div>`); d.textContent = s; term.append(d); };
  const dim = s => { const d = h(`<div class="line dim"></div>`); d.textContent = s; term.append(d); };
  const prompt = () => {
    const line = h(`<div class="line"><span class="prompt">opaline:${cwd}$ </span><input spellcheck="false" autocomplete="off"></div>`);
    term.append(line); const inp = $("input", line); inp.focus();
    inp.onkeydown = e => {
      if (e.key !== "Enter") return;
      const cmd = inp.value.trim(); inp.replaceWith(document.createTextNode(cmd)); run(cmd);
    };
  };
  const run = cmd => {
    const [c, ...args] = cmd.split(/\s+/);
    switch (c) {
      case "": break;
      case "help": dim("Commands: help, ls, cd DIR, pwd, uname -a, date, echo TEXT, whoami, about, open APP, clear, exit"); break;
      case "ls": { const dir = cwd === "/home" ? "home" : cwd.split("/").pop(); const k = TREE[dir]?.kids ?? []; out(k.map(x => TREE[x] ? x + "/" : x).join("   ") || ""); break; }
      case "cd": { const d = args[0]; if (!d || d === "~" || d === "/home") cwd = "/home"; else if (TREE[d.replace(/\/$/, "")]) cwd = "/home/" + d.replace(/\/$/, ""); else if (d === "..") cwd = "/home"; else out(`cd: ${d}: ENOENT (no such file or directory)`); break; }
      case "pwd": out(cwd); break;
      case "uname": out(args[0] === "-a" ? "OpalineOS opaline 0.6.1-se1 #1 OpalineOS x86_64" : "OpalineOS"); break;
      case "date": out(new Date().toUTCString()); break;
      case "echo": out(args.join(" ")); break;
      case "whoami": out("root"); break;
      case "about": dim("OpalineOS 0.6.1-se1 — kernel in C, musl, POSIX; Python and opaline-relief come next."); break;
      case "open": if (APPS[args[0]]) openApp(args[0]); else out("open: apps are " + Object.keys(APPS).join(", ")); break;
      case "clear": term.innerHTML = ""; break;
      case "exit": closeWin(w); return;
      default: out(`${c}: command not found`);
    }
    prompt(); term.scrollTop = term.scrollHeight;
  };
  dim("OpalineOS 0.6.1-se1 (tty) — type \"help\"");
  dim("Try: uname -a, ls, open settings");
  term.onclick = () => $("input", term)?.focus();
  prompt();
} };

      <div class="inner"><div><div class="val">0%</div><div class="caption" data-i18n="usage">${t("usage")}</div></div></div></div></div>

      <canvas class="panel" style="width:100%;flex:1;min-height:110px"></canvas></div>
      <div class="row" style="gap:14px"><div class="card grow" style="padding:12px 14px"><div class="row"><span class="label grow" data-i18n="memory">${t("memory")}</span><b class="mem">0%</b></div><div class="progress" style="margin-top:10px"><div class="memb"></div></div></div>
      <div class="card grow" style="padding:12px 14px"><div class="row"><span class="label grow" data-i18n="disk">${t("disk")}</span><b>38%</b></div><div class="progress" style="margin-top:10px"><div style="width:38%"></div></div></div></div></div></div>

    <div class="panel scroll" style="flex:1;min-height:0;padding:4px 8px"><table><thead><tr><th data-s="name" data-i18n="name">${t("name")}</th><th data-s="pid">PID</th><th data-s="cpu" data-i18n="cpu">CPU</th><th data-s="mem" data-i18n="memory">${t("memory")}</th><th data-i18n="status">${t("status")}</th></tr></thead><tbody></tbody></table></div>`;
  const canvas = $("canvas", body), ctx = canvas.getContext("2d"), hist = Array(60).fill(0);
  const procs = [["kernel", 0], ["sh", 31], ["compositor", 12], ["files", 44], ["terminal", 45], ["monitor", 46], ["posixtest", 52], ["python3", 58]]
    .map(([name, pid]) => ({ name, pid, cpu: 0, mem: Math.round(2 + Math.random() * 60) }));
  let sortKey = "cpu";
  $("thead", body).onclick = e => { const th = e.target.closest("[data-s]"); if (th) { sortKey = th.dataset.s; table(); } };
  const table = () => {
    const rows = [...procs].sort((a, b) => sortKey === "name" ? a.name.localeCompare(b.name) : b[sortKey] - a[sortKey]);
    $("tbody", body).innerHTML = rows.map((p, i) => `<tr class="${i === 0 ? "sel" : ""}"><td>${p.name}</td><td>${p.pid}</td><td>${p.cpu.toFixed(1)}%</td><td>${p.mem} MiB</td><td>${t(p.cpu > 1 ? "running" : "sleeping")}</td></tr>`).join("");
  };
  const draw = () => {
    const dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    ctx.lineWidth = 2.5; ctx.strokeStyle = accent; ctx.lineJoin = "round";
    const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, accent + "40"); grad.addColorStop(1, accent + "00");
    ctx.beginPath();
    hist.forEach((v, i) => { const x = i / (hist.length - 1) * W, y = H - 8 - v / 100 * (H - 16); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke(); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fillStyle = grad; ctx.fill();
  };
  const tick = () => {
    if (!body.isConnected) return clearInterval(timer);
    const cpu = Math.max(3, Math.min(97, (hist.at(-1) || 20) + (Math.random() - .5) * 30));
    hist.push(cpu); hist.shift();
    $(".arc", body).style.strokeDashoffset = 389.6 * (1 - cpu / 100);
    $(".val", body).textContent = Math.round(cpu) + "%";
    const mem = 41 + Math.round(Math.random() * 6); $(".mem", body).textContent = mem + "%"; $(".memb", body).style.width = mem + "%";
    procs.forEach(p => p.cpu = Math.max(0, p.name === "monitor" ? 2 + Math.random() * 3 : Math.random() < .5 ? 0 : Math.random() * cpu / 3));
    table(); draw();
  };
  const timer = setInterval(tick, 1000); tick();
  APPS.monitor.onResize = () => draw();
  langListeners.push(() => body.isConnected && table());
} };

  const mail = $(".mail", body), hint = $(".hint", body);
  mail.oninput = () => {
    const v = mail.value, ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
    mail.classList.toggle("error", !!v && !ok);
    hint.className = "caption hint" + (v && !ok ? " err" : "");
    hint.dataset.i18n = !v ? "helper" : ok ? "valid" : "invalid"; hint.textContent = t(hint.dataset.i18n);
    if (v && !ok && !mail._shook && mode() !== "none") { mail._shook = true; mail.animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(5px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 320 }); }
    if (ok) mail._shook = false;
  };
  // tabs
  const tabs = $(".tabs", body), ind = $(".ind", tabs);
  const placeInd = b => { ind.style.left = b.offsetLeft + "px"; ind.style.width = b.offsetWidth + "px"; };
  tabs.onclick = e => { const b = e.target.closest(".tab"); if (!b) return; tabs.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); placeInd(b); };
  requestAnimationFrame(() => placeInd($(".tab.on", tabs)));
  langListeners.push(() => body.isConnected && requestAnimationFrame(() => placeInd($(".tab.on", tabs))));
  // pager
  const pager = $(".pager", body);
  pager.onclick = e => {
    const b = e.target.closest(".pg"); if (!b) return;
    const pages = [...pager.querySelectorAll(".pg:not(.prev):not(.nextp)")]; let i = pages.findIndex(p => p.classList.contains("on"));
    i = b.classList.contains("prev") ? Math.max(0, i - 1) : b.classList.contains("nextp") ? Math.min(pages.length - 1, i + 1) : pages.indexOf(b);
    pages.forEach((p, k) => p.classList.toggle("on", k === i));
  };
  // steps
  const stepsEl = $(".steps", body); let step = 1; const names = ["account", "details", "review", "payment"];
  const drawSteps = () => {
    stepsEl.innerHTML = names.map((n, i) => `<div class="step ${i < step ? "done" : i === step ? "cur" : ""}"><div class="n">${i < step ? icon("check", "s16") : i + 1}</div><span>${i + 1}. ${t(n)}</span></div>`).join("");
    const pct = Math.round(step / (names.length - 1) * 100);
    $(".pbar", body).style.width = pct + "%"; $(".pv", body).textContent = pct + "%";
  };
  $(".sn", body).onclick = () => { step = Math.min(names.length - 1, step + 1); drawSteps(); if (step === names.length - 1) toast(t("review") + " ✓", "success"); };
  $(".sb", body).onclick = () => { step = Math.max(0, step - 1); drawSteps(); };
  drawSteps(); langListeners.push(() => body.isConnected && drawSteps());
  // feedback
  $(".t1", body).onclick = () => toast(t("saved"), "success", "Success:");
  $(".t2", body).onclick = () => toast(t("updates"), "info", "Info:");
  $(".t3", body).onclick = () => toast(t("errorConn"), "error", "Error:");
  $(".dlg", body).onclick = async () => { if (await dialog(t("deleteAcc"), t("sure"), t("del"), true)) toast(t("deleted"), "warning"); };
  langListeners.push(() => {
    if (!body.isConnected) return;
    body.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    body.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  });
} };

/* ---- About ---- */
APPS.about = { icon: "about", w: 420, h: 330, build(body) {
  body.innerHTML = `<div class="col" style="align-items:center;text-align:center;gap:14px;padding-top:6px">
    <div class="avatar" style="width:84px;height:84px;border-radius:26px;box-shadow:var(--e3);color:var(--accent)"><svg class="i" style="width:44px;height:44px"><use href="#i-logo"/></svg></div>
    <h2>OpalineOS</h2><div class="caption" data-i18n="aboutText">${t("aboutText")}</div>
    <div class="row"><span class="badge soft">musl 1.2.6</span><span class="badge soft">POSIX</span><span class="badge">Relief</span></div></div>`;
} };

/* ===================================================================================================
   Launcher, quick settings, notifications, clock
   =================================================================================================== */
const ORDER = ["files", "terminal", "settings", "monitor", "editor", "components", "about"];
$("#appgrid").innerHTML = ORDER.map(id => `<button class="app-tile" data-app="${id}"><div class="ico">${icon(APPS[id].icon)}</div><span data-i18n="${id}">${t(id)}</span></button>`).join("");
$("#appgrid").onclick = e => { const b = e.target.closest("[data-app]"); if (b) openApp(b.dataset.app); };
$("#start").onclick = () => showPop($("#launcher"), $("#start"));
$("#search").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".app-tile").forEach(tile => tile.classList.toggle("hidden", !!q && !t(tile.dataset.app).toLowerCase().includes(q) && !tile.dataset.app.includes(q)));
};
$("#search").onkeydown = e => { if (e.key === "Enter") { const first = document.querySelector(".app-tile:not(.hidden)"); if (first) openApp(first.dataset.app); } };

const QS = [["wifi", "wifi", true], ["bluetooth", "bt", false], ["airplane", "plane", false], ["night", "moon", false]];
function drawQS() {
  $("#qs").innerHTML = QS.map(([k, ic, on], i) => `<button class="qs ${on ? "on" : ""}" data-i="${i}"><div class="ic">${icon(ic, "s16")}</div><div><b>${t(k)}</b><small>${on ? (k === "wifi" ? t("connected") : t("on")) : t("off")}</small></div></button>`).join("");
}
$("#qs").onclick = e => {
  const b = e.target.closest(".qs"); if (!b) return;
  const q = QS[+b.dataset.i]; q[2] = !q[2];
  if (q[0] === "night") $("#night").style.opacity = q[2] ? .16 : 0;
  drawQS();
  const nb = $(`#qs [data-i="${b.dataset.i}"] .ic`);
  if (mode() !== "none") nb.animate(springFrames(p => ({ transform: `scale(${.8 + .2 * p})` })), { duration: springMs() });
};
drawQS(); langListeners.push(drawQS);
makeSlider($("#bright"), { value: 1, min: .3, max: 1, onChange: v => $("#dim").style.opacity = (1 - v) * .8 });
makeSlider($("#vol"), { value: .6 });
document.querySelectorAll("[data-qs-open]").forEach(b => b.onclick = () => showPop($("#center"), $("#bell")));
$("#bell").onclick = () => { showPop($("#center"), $("#bell")); $("#bell-dot").classList.remove("show"); };
$("#clockbtn").onclick = () => showPop($("#center"), $("#bell"));
const notifs = [];
function addNotif(text, ic, kind) { notifs.unshift({ text, ic, kind, time: new Date() }); notifs.length = Math.min(notifs.length, 6); drawNotifs(); if (openPop?.id !== "center") $("#bell-dot").classList.add("show"); }
function drawNotifs() {
  const host = $("#notifs");
  host.innerHTML = notifs.length ? notifs.map((n, i) => `<div class="notif" data-i="${i}"><div class="ic" style="color:${KINDS[n.kind][0]}">${icon(n.ic, "s16")}</div><div class="grow"><b style="font-size:13px">${n.text}</b><p>${n.time.toLocaleTimeString(lang === "pt" ? "pt-BR" : "en-US", { hour: "2-digit", minute: "2-digit" })}</p></div><button class="wb x">${icon("close")}</button></div>`).join("")
    : `<div class="caption" style="text-align:center;padding:18px">${t("noNotif")}</div>`;
}
$("#notifs").onclick = e => {
  const x = e.target.closest(".x"); if (!x) return;
  const card = x.closest(".notif"), i = +card.dataset.i;
  card.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(80px)" }], { duration: 200, easing: "cubic-bezier(.4,0,1,1)" })
    .onfinish = () => { notifs.splice(i, 1); drawNotifs(); };
};
$("#clearall").onclick = () => {
  const cards = [...document.querySelectorAll("#notifs .notif")];
  cards.forEach((c, i) => c.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(80px)" }], { duration: 200, delay: i * 50, fill: "forwards" }));
  setTimeout(() => { notifs.length = 0; drawNotifs(); }, 200 + cards.length * 50);
};
drawNotifs(); langListeners.push(drawNotifs);
function tickClock() {
  const now = new Date(), loc = lang === "pt" ? "pt-BR" : "en-US";
  $("#clock").textContent = now.toLocaleDateString(loc, { weekday: "short", day: "numeric", month: "short" }) + "  " + now.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
}
setInterval(tickClock, 1000 * 15);

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#dialog").style.display === "block") closeDialog(false); else hidePop(); }
  if (e.ctrlKey && e.code === "Space") { e.preventDefault(); showPop($("#launcher"), $("#start")); }
});

/* ===================================================================================================
   Power: boot, shut down, restart
   =================================================================================================== */
let booting = false;
function boot() {
  booting = true;
  const b = $("#boot"), bar = $("#bootbar");
  b.style.display = "grid"; b.style.opacity = 1;
  $("#boothint").textContent = t("starting");
  const logo = $(".logo-wrap", b);
  logo.animate(springFrames(p => ({ transform: `scale(${.6 + .4 * p})`, opacity: Math.min(1, p * 2) })), { duration: springMs() * 1.4 });
  bar.style.transition = "none"; bar.style.width = "0%";
  requestAnimationFrame(() => { bar.style.transition = "width 1100ms cubic-bezier(.4,0,.2,1)"; bar.style.width = "100%"; });
  setTimeout(() => {
    b.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: "ease" }).onfinish = () => { b.style.display = "none"; booting = false; };
    $("#bar").animate(springFrames(p => ({ transform: `translateY(${(1 - p) * -60}px)` })), { duration: springMs() + 100 });
    setTimeout(() => { toast(t("welcomeSub"), "info", t("welcome") + "."); }, 450);
  }, 1300);
}
function powerOff(restart) {
  hidePop(true);
  for (const w of [...wins.values()]) closeWin(w);
  const b = $("#boot");
  setTimeout(() => {
    b.style.display = "grid"; $("#bootbar").style.width = "0%"; $("#boothint").textContent = restart ? t("restartNote") : t("shutting");
    b.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    setTimeout(() => {
      if (restart) return boot();
      b.style.background = "#1B1916"; $(".box", b).style.opacity = .0;
      const msg = h(`<div style="position:absolute;bottom:40px;width:100%;text-align:center;color:#6F665C;font-size:13px">${t("turnOn")}</div>`);
      b.append(msg);
      b.onclick = () => { b.onclick = null; msg.remove(); b.style.background = ""; $(".box", b).style.opacity = 1; boot(); };
    }, 1200);
  }, 250);
}
$("#shutdown").onclick = async () => { hidePop(); if (await dialog(t("shutdown") + "?", "OpalineOS", t("shutdown"))) powerOff(false); };
$("#restart").onclick = () => { hidePop(); powerOff(true); };

/* start */
applyLang();
boot();
setTimeout(() => { openApp("components"); }, 1900);
</script>
</body>
</html>
